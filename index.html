  <!-- Failsafe SW registration – runs even if app.js fails to parse -->
  <script>
  if ('serviceWorker' in navigator) {
    // Was a worker already controlling this page at startup? If so, a later
    // controller change means a NEW version activated → reload once to pick it
    // up. (On the very first visit there's no controller, so we don't reload.)
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      // A new SW took control. If there was already a controller (i.e. this is an
      // *update*, not the very first install), reload to run the new code.
      // We don't guard with a reloaded flag here — location.reload() navigates
      // away immediately, so this handler can only fire once per page load anyway.
      if (!hadController) { hadController = true; return; }
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
      // Re-check for a new version aggressively. Installed mobile PWAs resume
      // from a frozen / bfcache state and don't reliably fire focus or
      // visibilitychange, so updates can lag for days. Cover every resume signal
      // we can, check immediately on load, and poll while the app is open.
      var check = function () { reg.update().catch(function () {}); };
      check();
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      window.addEventListener('focus', check);
      window.addEventListener('pageshow', check);       // fires on bfcache restore (mobile resume)
      window.addEventListener('online', check);
      setInterval(function () { if (!document.hidden) check(); }, 60 * 1000);
      // When a new worker finishes installing while an old one still controls the
      // page, tell it to activate now. sw.js already calls skipWaiting(); this is
      // a backstop for browsers that don't honour it on their own.
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            try { nw.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
          }
        });
      });
    }).catch(function () {});
  }
  </script>
  <!-- Dexie for IndexedDB -->
