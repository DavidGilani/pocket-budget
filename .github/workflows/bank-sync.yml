name: Bank sync

# Pulls new Lloyds credit-card transactions into Firestore's importQueue for
# review in the app. Requires "Bank connect" to have run first.
#
# No GitHub schedule here: GitHub delays scheduled runs by hours. Instead the
# Cloudflare Worker (bank-sync/worker/worker.js) triggers this workflow on time
# at 7am, 1pm and 6pm UK time (DST-aware), and also on each in-app
# "Pull from bank now" tap. Open Banking allows ~4 unattended pulls a day, so
# three scheduled slots leave roughly one on-demand tap. It can also be run
# manually from the Actions tab (Run workflow).

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: bank-sync
        run: npm install --no-audit --no-fund
      - name: Fetch transactions -> import queue
        working-directory: bank-sync
        env:
          TL_ENV: live
          TL_CLIENT_ID: ${{ secrets.TL_CLIENT_ID }}
          TL_CLIENT_SECRET: ${{ secrets.TL_CLIENT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
        run: node sync.mjs
